version: "1.0"
workflow:
  name: retry-ok
  trigger:
    type: manual
  steps:
    - name: flaky
      type: action
      action: python
      params:
        script: |
          import pathlib
          p = pathlib.Path("attempts.txt")
          n = int(p.read_text()) + 1 if p.exists() else 1
          p.write_text(str(n))
          print("attempt", n)
          raise SystemExit(1 if n <= 2 else 0)
      retry:
        max: 3
        delay: 1
