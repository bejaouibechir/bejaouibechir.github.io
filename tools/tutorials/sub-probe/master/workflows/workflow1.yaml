version: "1.0"
workflow:
  name: workflow1
  description: Master workflow
  trigger:
    type: manual
  steps:
    - name: job1
      type: job
      job: ../jobs/job1
      depends_on: []
      on_failure: fail
    - name: call_child
      type: project
      project: ../child
      params:
        min_value: 150
      outputs: [result_rows]
      depends_on: [job1]
    - name: show
      type: action
      action: log
      params:
        message: "child {{ project:call_child.status }}, {{ project:call_child.rows }} row(s), published {{ project:call_child.param.result_rows }}"
      depends_on: [call_child]
