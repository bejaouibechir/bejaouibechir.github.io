version: "1.0"
workflow:
  name: workflow1
  description: Master workflow
  trigger:
    type: manual
  steps:
    - name: job1
      type: job
      job: ../jobs/job1
      depends_on: []
      on_failure: fail
    - name: call_child
      type: project
      project: ../child
      params:
        not_declared: 1
      depends_on: [job1]
