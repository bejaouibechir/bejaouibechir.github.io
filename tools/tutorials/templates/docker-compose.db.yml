# Databases for tutorials that need a real server (NOT tested in the authoring environment: Docker was not available).
# Start:  docker compose -f docker-compose.db.yml up -d
# Stop:   docker compose -f docker-compose.db.yml down -v
# The passwords below are throw-away values for local tutorials only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hydra_demo
      POSTGRES_PASSWORD: hydra_demo_pw
      POSTGRES_DB: shop
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra_demo -d shop"]
      interval: 5s
      retries: 10
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: hydra_root_pw
      MYSQL_DATABASE: shop
      MYSQL_USER: hydra_demo
      MYSQL_PASSWORD: hydra_demo_pw
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-phydra_root_pw"]
      interval: 5s
      retries: 20
