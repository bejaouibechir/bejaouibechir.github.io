name: hydra-whitebook-csv-mysql
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: whitebook-root-only
      MYSQL_DATABASE: shop
      MYSQL_USER: etl
      MYSQL_PASSWORD: whitebook-etl-only
    ports:
      - "127.0.0.1:3312:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-products.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
volumes:
  mysql-data:
