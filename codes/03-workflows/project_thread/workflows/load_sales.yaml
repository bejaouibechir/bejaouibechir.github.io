version: '1.0'
workflow:
  name: load_sales
  trigger: {type: manual}
  steps:
    - name: wait_for_sales
      type: action
      action: delay
      params:
        seconds: "{{ param:sales_delay }}"
    - name: mark_sales
      type: action
      action: log
      params: {message: 'Live sales ready'}
      depends_on: [wait_for_sales]
