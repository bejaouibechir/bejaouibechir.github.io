name: hydra-whitebook-workflow-rollback
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rollback_demo
      POSTGRES_PASSWORD: whitebook-rollback-only
      POSTGRES_DB: rollback_demo
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-rollback.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rollback_demo -d rollback_demo"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
volumes:
  postgres-data:
