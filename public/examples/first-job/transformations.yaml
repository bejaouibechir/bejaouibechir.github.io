version: "1.0"
steps:
  - filter:
      expr: "status == 'paid'"

  - cast:
      mapping:
        id: int
        amount: float

  - filter:
      expr: "amount > 0"

  - clean:
      columns: [region]
      case: lower

  - select:
      columns: [id, order_date, region, customer, amount]

  - sort:
      by: [order_date]
      ascending: true
