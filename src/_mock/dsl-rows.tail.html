      <div class="why">
        <article class="info"><h2>What just happened?</h2><p>Hydra evaluates the expression on every row. A row whose <code>amount</code> is empty never matches — a comparison against a missing value is false, not an error.</p></article>
        <article class="info"><h2>Good to know</h2><p>On a compatible SQL source, Hydra can push this filter down as a <code>WHERE</code> clause instead of loading every row.</p></article>
      </div>
