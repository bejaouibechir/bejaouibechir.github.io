<div class="wrap">
  <div class="hero">
    <h1>Explore, edit and run every Hydra DSL element</h1>
    <p>The executable reference for Hydra. Search a name, browse a family, or describe what you want to do.</p>
    <div class="bigsearch">
      <span class="si"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      <input id="search" placeholder="Search elements, or type an intent…" aria-label="Search the DSL">
      <span class="kk" id="searchKey">Ctrl K</span>
    </div>
    <div class="intentchips" id="intentChips"></div>
  </div>

  <div class="catbar">
    <div class="modes" role="group" aria-label="Navigation mode">
      <button class="on" data-mode="groups" aria-pressed="true">Groups</button>
      <button data-mode="az" aria-pressed="false">A–Z</button>
      <button data-mode="intent" aria-pressed="false">Intent</button>
    </div>
    <div class="filtergroup"><span class="flabel">category</span><div class="filteropts" id="catFilters"></div></div>
    <div class="filtergroup"><span class="flabel">status</span><div class="filteropts" id="statusFilters"></div></div>
    <div class="filtergroup"><span class="flabel">capability</span><div class="filteropts" id="capFilters"></div></div>
    <span class="count" id="count"></span>
  </div>

  <div id="catalog"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
